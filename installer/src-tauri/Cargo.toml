[package]
name = "octowow-hd-installer"
version = "1.1.0"
description = "OctoWoW HD Switch installer and updater"
authors = ["Mustafa Yaman"]
license = ""
repository = "https://github.com/fmustafayaman/OctoWoW-HD-Switch"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
dirs = "6"
tokio = { version = "1", features = ["fs", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }
